<!doctype html>
<html lang="pt-BR" style="color-scheme: dark;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal de Cursos – SENAI</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14213d;--mut:#5b6577;--ac:#d6001c;--bd:#e2e5ea;--warn:#fff4d6;--warnb:#f0c85a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a202c;--tx:#eef1f6;--mut:#a3adbf;--bd:#2c3547;--warn:#3a321a;--warnb:#7a6420;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--ac);color:#fff;padding:18px 16px}header .in,main{max-width:900px;margin:0 auto}
header h1{margin:0;font-size:1.3rem}header p{margin:2px 0 0;opacity:.9;font-size:.9rem}
main{padding:16px}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.card.c{cursor:pointer}.card.c:hover{border-color:var(--ac)}
.tag{font-size:.75rem;color:var(--ac);font-weight:700;text-transform:uppercase}.mut{color:var(--mut);font-size:.9rem}
h2{margin:.3rem 0}h3{margin:.2rem 0;font-size:1rem}
.notice{background:var(--warn);border:1px solid var(--warnb);border-radius:10px;padding:12px;margin:12px 0}
a.btn,button{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-size:.9rem;cursor:pointer;text-decoration:none}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.item{display:flex;gap:12px;align-items:flex-start;margin:10px 0}.item>div{flex:1;min-width:0}
.play{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
input,textarea,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0}
label{font-size:.8rem;color:var(--mut)}.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 16px}
.bar .in{max-width:900px;margin:0 auto}.sub{border-top:1px dashed var(--bd);margin-top:10px;padding-top:6px}
:root,:root:not([data-theme="light"]){--bg:#08172f;--card:#0f2549;--tx:#f2f4f8;--mut:#9db4d6;--ac:#ff7a00;--bd:#1d3b6b;--warn:#2a2410;--warnb:#a8861f;color-scheme:dark}
body{background:radial-gradient(900px 400px at 85% -5%,#0a2a5e 0,transparent 60%),repeating-linear-gradient(45deg,#08172f 0 4px,#0b1d3a 4px 8px);min-height:100vh}
header.hero{background:linear-gradient(115deg,#06142e 0,#081c42 55%,#11408f 150%);border-bottom:4px solid var(--ac);padding:0}
.hero .in{display:flex;align-items:center;gap:22px;padding:26px 16px;flex-wrap:wrap}
.hero h1{font-size:clamp(1.7rem,6vw,2.8rem);text-transform:uppercase;font-style:italic;font-weight:900;line-height:1.05;margin:8px 0 4px}
.hero h1 b{color:var(--ac)}.hero p{font-size:1rem;opacity:.85;margin:0}
.badge{display:inline-block;background:var(--ac);color:#fff;font-size:.72rem;font-weight:800;padding:3px 12px;letter-spacing:1.5px;text-transform:uppercase;transform:skewX(-12deg)}
.gauge{width:140px;flex:none;filter:drop-shadow(0 0 12px #ff7a0055)}
.needle{transform-origin:60px 60px;animation:rev 2.6s ease-in-out infinite alternate}
@keyframes rev{from{transform:rotate(-75deg)}to{transform:rotate(65deg)}}
@media (prefers-reduced-motion:reduce){.needle{animation:none;transform:rotate(40deg)}}
.flag{height:14px;background:conic-gradient(#fff 25%,#000 0 50%,#fff 0 75%,#000 0) 0 0/14px 14px;opacity:.9}
h2{text-transform:uppercase;font-style:italic;letter-spacing:.5px}h2::after{content:'';display:block;width:56px;height:4px;background:var(--ac);margin-top:6px;transform:skewX(-20deg)}
.card{box-shadow:0 2px 0 #00000055}
.card.c{position:relative;overflow:hidden;border-left:5px solid var(--ac);transition:transform .15s,box-shadow .15s}
.card.c:hover{transform:translateY(-4px);box-shadow:0 12px 30px #ff7a0033}
.ico{font-size:2.2rem;line-height:1;margin-bottom:6px}.cta{color:var(--ac);font-weight:800;text-transform:uppercase;font-size:.8rem;letter-spacing:1px;margin-top:10px}
a.btn,button{border-radius:4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-size:.8rem}
.play{box-shadow:0 0 0 3px #ff7a0044,0 0 14px #ff7a0066}
.tag{letter-spacing:1.5px}.notice{border-left:5px solid var(--warnb)}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:0 16px 24px}footer .flag{margin-bottom:14px}
.vid{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;margin:8px 0 10px;border:2px solid var(--ac)}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mat{border-bottom:1px solid var(--bd)}.mat summary{cursor:pointer;font-weight:700;padding:10px 0}.matb{white-space:pre-wrap;padding:4px 0 14px 12px;border-left:3px solid var(--ac);margin-bottom:6px}textarea{min-height:90px}
:root,:root:not([data-theme="light"]){--bg:#fff7ee;--card:#fff;--tx:#14284b;--mut:#5a6b85;--ac:#ff7a00;--bl:#11408f;--bd:#f6d9b8;--warn:#fff0d4;--warnb:#ff9a2e;color-scheme:light}
body{background:linear-gradient(180deg,#ffe3c2 0,#fff7ee 340px) fixed}
header.hero{background:linear-gradient(115deg,#ff7a00 0,#ff9a2e 70%,#ffb454 130%);color:#14284b;border-bottom:4px solid var(--bl)}
.badge{background:var(--bl);color:#fff}.hero h1 b{color:#fff}.gauge path{stroke:#fff}
.tag,.cta{color:var(--bl)}h3{color:var(--bl)}.card{box-shadow:0 2px 10px #ff7a0020}.card.c:hover{box-shadow:0 12px 30px #ff7a0040}
a.btn,button{color:#14284b}button.g{color:var(--bl);border-color:var(--bl)}button.d{color:#c25500;border-color:#c25500}
.bar{background:#fff}.play{background:var(--ac);color:#14284b}input[type=range]{accent-color:var(--ac);padding:0}
.anim{border:1px solid var(--bd);border-top:4px solid var(--bl);border-radius:10px;padding:12px;margin:14px 0;background:#fffdfa}
.svgw svg{width:100%;height:auto;display:block}.read{font-weight:700;color:var(--bl);margin:8px 0;min-height:3em}.sl{display:block;font-size:.85rem;color:var(--mut);margin:6px 0}
:root:not([data-theme="light"]){--bg:#0c1427;--card:#141f38;--tx:#eef3fc;--mut:#a9b8d4;--ac:#ff7a00;--bl:#5aa2ff;--bd:#27385e;--warn:#33270f;--warnb:#ff9a2e;color-scheme:dark}
:root:not([data-theme="light"]) body{background:radial-gradient(900px 380px at 85% -5%,#3b2208 0,transparent 60%),#0c1427 fixed}
:root:not([data-theme="light"]) .bar{background:var(--card)}
:root:not([data-theme="light"]) .anim{background:#101a31}
:root:not([data-theme="light"]) .badge{background:#11408f}
:root:not([data-theme="light"]) button.d{color:#ffa94d;border-color:#ffa94d}
:root:not([data-theme="light"]) .card{box-shadow:0 2px 0 #0006}
.svgw{background:#fff7ee;border-radius:8px;padding:6px}
.tg{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:30;border-radius:999px;background:#14284b;color:#fff;padding:10px 16px;box-shadow:0 4px 14px #0006;border:1px solid #ff7a00}
.on{background:var(--ac)!important;color:#14284b!important;border-color:var(--ac)!important}.pulse{animation:pl 1s ease-in-out infinite}@keyframes pl{50%{opacity:.3}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;background:linear-gradient(135deg,#14284b,#11408f 60%,#ff7a00);text-decoration:none;font-weight:700}.pb{width:60px;height:60px;border-radius:50%;background:var(--ac);color:#14284b;display:flex;align-items:center;justify-content:center;font-size:24px}
.vid{padding-top:0;aspect-ratio:16/9;max-width:300px;width:100%}.fb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fb .pb,.fb .ft{position:relative;z-index:1}.pb{width:46px;height:46px;font-size:18px;box-shadow:0 2px 10px #0008}.ft{font-size:.72rem;text-shadow:0 1px 4px #000}
.logo{background:#fff;border-radius:12px;padding:8px 14px;box-shadow:0 4px 14px #0003;flex:none}.logo img{display:block;height:60px;width:auto}
:root[data-theme="light"]{--bg:#eef3fb;--card:#fff;--tx:#0f2650;--mut:#51638a;--ac:#e8490f;--bl:#11408f;--bd:#d3def2;--warn:#fff1e6;--warnb:#e8490f;--btn:#11408f;--btnt:#fff;color-scheme:light}
:root:not([data-theme="light"]){--bg:#081a3d;--card:#0f2a5c;--tx:#eef3fc;--mut:#a9bbdd;--ac:#ff6a2b;--bl:#7fb0ff;--bd:#1f3f7a;--warn:#3a2210;--warnb:#ff6a2b;--btn:#2f6fd6;--btnt:#fff;color-scheme:dark}
:root[data-theme="light"] body{background:linear-gradient(180deg,#d6e3f8 0,#eef3fb 340px) fixed}
:root:not([data-theme="light"]) body{background:radial-gradient(900px 380px at 85% -5%,#14429a 0,transparent 60%),#081a3d fixed}
header.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#0b2d6b 0,#11408f 60%,#1a56b8 140%);color:#fff;border-bottom:4px solid #e8490f}
header.hero::after{content:'';position:absolute;right:-26px;top:0;bottom:0;width:110px;background:#e8490f;transform:skewX(-18deg);opacity:.95}
.hero .in{position:relative;z-index:1}.hero h1 b{color:#ff8a4c}.badge{background:#e8490f;color:#fff}.gauge path{stroke:#ff8a4c}
:root:not([data-theme="light"]) .badge{background:#e8490f}
a.btn,button{background:var(--btn);color:var(--btnt)}button.g{background:transparent;color:var(--bl);border:1px solid var(--bl)}button.d{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.on{background:var(--ac)!important;color:#fff!important;border-color:var(--ac)!important}
.play,.pb{background:var(--ac);color:#fff}.tg{border-color:var(--ac)}
.card{box-shadow:0 2px 10px #11408f22}.card.c:hover{box-shadow:0 12px 30px #11408f40}
.anim{background:#f7faff}.svgw{background:#f5f8ff}
:root:not([data-theme="light"]) .anim{background:#0b2150}:root:not([data-theme="light"]) .card{box-shadow:0 2px 0 #0006}
:root:not([data-theme="light"]) button.d{color:var(--ac);border-color:var(--ac)}:root:not([data-theme="light"]) .bar{background:var(--card)}
.logo2{margin-left:auto}.logo2 img{height:46px}
.brands{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%}
.logo,.logo2{height:72px;margin:0;padding:0 18px;display:flex;align-items:center;justify-content:center}
.logo img,.logo2 img{height:46px;width:auto;max-width:100%}
@media (max-width:520px){.logo,.logo2{height:56px;padding:0 10px}.logo img,.logo2 img{height:32px}}
.ms{font-size:.9rem;margin:4px 0 8px}.ms div{padding:2px 0}
.tb{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}.tb td,.tb th{border:1px solid var(--bd);padding:4px 6px;text-align:center}

/* ===== Multímetros no celular: aparelho sempre enquadrado ===== */
.labfix{position:sticky;top:0;z-index:4;background:inherit;padding:4px 0 6px;border-bottom:1px solid var(--bd);touch-action:manipulation}
.labfix .svgw{padding:2px}
.labfix .read{margin:6px 0 0;min-height:0;font-size:.9rem;line-height:1.3;max-height:5.6em;overflow-y:auto}
.labfix svg [data-a]{-webkit-tap-highlight-color:transparent}
@media (max-width:700px){main{padding:10px}.anim{padding:8px}.card{padding:12px}}
@media (max-height:480px){.labfix{position:static}}

<script id="data" type="application/json">[{"id":"diagnostico-eletrico","title":"Diagnóstico Elétrico Automotivo","category":"Elétrica & Eletrônica Embarcada","workload":"40 Horas • In-Company Arte Trigo","description":"Capacitação prática em testes com multímetro digital, osciloscópio automotivo, queda de tensão, sistemas de carga e partida (alternador e bateria), sensores, atuadores e redes multiplexadas (CAN Bus).","welcomeMessage":"Bem-vindo ao curso de Diagnóstico Elétrico Automotivo. Abaixo você encontra todas as videoaulas práticas e os arquivos técnicos em PDF compartilhados via Google Drive e OneDrive pelo instrutor do SENAI.","instructorNotice":"Atenção alunos: Façam o download dos diagramas elétricos e da apostila no Google Drive/OneDrive antes das aulas práticas na oficina para consultar durante as medições.","videos":[{"id":"v1","title":"Medição de Queda de Tensão no Sistema Elétrico Automotivo","duration":"14 min","youtubeId":"M7FIvfx5J10","description":"Técnica correta de medição de queda de tensão (Voltage Drop) para detectar oxidações e mau contato sem desmontar chicotes."},{"id":"v2","title":"Osciloscópio Automotivo: Sinais de Sensores e Rede CAN","duration":"18 min","youtubeId":"ScMzIvxBSi4","description":"Configuração prática de base de tempo e canais para diagnóstico de sinais PWM e comunicação da rede CAN."},{"id":"v3","title":"Diagnóstico de Consumo Parasita da Bateria","duration":"12 min","youtubeId":"M7FIvfx5J10","description":"Procedimento com multímetro em série para localizar circuitos com fuga de corrente em repouso."}],"pdfs":[],"materials":[{"id":"m0","title":"Resumo: Lei de Ohm e queda de tensão","content":"LEI DE OHM E POTÊNCIA\nV = R × I   |   P = V × I\nExemplo: lâmpada de 12 V / 60 W → I = 60 ÷ 12 = 5 A.\n\nQUEDA DE TENSÃO (VOLTAGE DROP)\n• Meça com o circuito em funcionamento (carga ligada); sem corrente, a medição não mostra o problema.\n• Coloque as pontas do multímetro nas duas extremidades do trecho a testar (ex.: borne positivo da bateria → terminal do componente).\n• Quanto maior a queda, maior a resistência indesejada (oxidação, terminal frouxo, cabo danificado).\n• Valores usuais de referência: conexões até ~0,1 V e cabos até ~0,2 V. Confirme sempre no manual do fabricante.\n\nPASSO A PASSO\n1. Identifique o trecho (positivo ou negativo).\n2. Ligue a carga.\n3. Meça e anote.\n4. Compare com a referência e localize o ponto de maior queda."},{"id":"m1","title":"Roteiro prático: consumo parasita da bateria","content":"OBJETIVO: localizar circuitos que consomem corrente com o veículo desligado.\n\nSEGURANÇA\n• Nunca dê partida nem acione cargas fortes com o multímetro em série na escala de corrente.\n• Use a escala de 10 A e o borne correto do multímetro.\n\nPROCEDIMENTO\n1. Desligue todas as cargas, feche portas e capô e aguarde os módulos entrarem em repouso (pode levar de 10 a 40 min).\n2. Solte o cabo negativo e ligue o multímetro em SÉRIE entre o polo e o cabo.\n3. Leia a corrente em repouso. Como referência, valores acima de ~50 mA merecem investigação (verifique o manual).\n4. Retire os fusíveis um a um, observando em qual a corrente cai.\n5. Registre o circuito encontrado e as possíveis causas.\n\nREGISTRO: veículo, data, corrente medida, fusível/circuito suspeito, conclusão."},{"id":"m2","title":"Exercícios de fixação (com gabarito)","content":"1) Um circuito de 12 V alimenta uma lâmpada de 60 W. Qual a corrente?\n2) Em uma partida, a queda medida no cabo positivo foi 0,3 V e no negativo 0,4 V. Qual a queda total e o que fazer?\n3) Para que serve ajustar a base de tempo do osciloscópio?\n4) Por que a queda de tensão deve ser medida com a carga ligada?\n\nGABARITO\n1) I = P ÷ V = 60 ÷ 12 = 5 A.\n2) 0,3 + 0,4 = 0,7 V. Está acima das referências usuais; inspecione terminais, massa e cabos e meça novamente trecho a trecho.\n3) Ajusta o tempo por divisão da tela para visualizar corretamente o sinal (PWM, CAN) sem comprimir nem esticar demais a forma de onda.\n4) Porque só com corrente circulando a resistência indesejada gera queda de tensão mensurável."}],"anims":["mmV","mmA","mmR","mmF"]},{"id":"metrologia","title":"Metrologia Industrial e Automotiva","category":"Inspeção & Controle Dimensional","workload":"40 Horas • In-Company Arte Trigo","description":"Domínio prático de instrumentos de medição mecânica de precisão: paquímetro analógico e digital (0,05mm e 0,02mm), micrômetro externo (0,01mm), relógio comparador e tolerâncias dimensionais.","welcomeMessage":"Bem-vindo ao curso de Metrologia. Acesse os manuais, tabelas de conversão e apostilas disponibilizadas pelo instrutor nos links do OneDrive e Google Drive para download.","instructorNotice":"Lembrete: Baixem a folha de exercícios de leitura de paquímetro e micrômetro no Google Drive e tragam preenchida para a aula de aferição.","videos":[{"id":"vm1","title":"Leitura Prática do Paquímetro em Milímetros (Resolução 0,05mm)","duration":"15 min","youtubeId":"aCW8ynMzYwc","description":"Passo a passo didático SENAI para identificar o zero do nônio na escala principal e o traço coincidente."},{"id":"vm2","title":"Como Utilizar o Micrômetro Externo (Resolução 0,01mm)","duration":"16 min","youtubeId":"RmvOsQFN738","description":"Demonstração de leitura na bainha e no tambor graduado com uso da catraca limitadora de torque."},{"id":"vm3","title":"Medição de Empenamento com Relógio Comparador","duration":"11 min","youtubeId":"rftsxJ4KgaI","description":"Instalação da base magnética, pré-carga da haste e medição de batimento em discos de freio."},{"id":"vmx1","title":"Metrologia — Aula 04: Paquímetro, tipos e usos (princípio do nônio e resolução)","duration":"","youtubeId":"MthTP9IYmeg","description":"Tipos de paquímetro, princípio do nônio e cálculo de resolução, conteúdo alinhado ao curso de Metrologia."},{"id":"vmx2","title":"Paquímetro: 10 exemplos de leitura com nônio de 50 divisões (0,02 mm)","duration":"","youtubeId":"KTk9rColysA","description":"Prática de leitura em milímetros com resolução de 0,02 mm."},{"id":"vmx3","title":"Aula de paquímetro: leitura em milímetro","duration":"","youtubeId":"PqTRiIxgzEE","description":"Passo a passo da leitura de medidas no paquímetro, com o Prof. Maércio Nascimento (ex-professor do SENAI)."}],"pdfs":[{"id":"pdf-1","title":"Apostila 01","url":"https://sesigoias-my.sharepoint.com/:b:/g/personal/sergiomendes_senai_fieg_com_br/IQCSA1JxmcBHT5yN0Q7KzfoaAZi22e1NvW4sWZLIXMZChQE?e=ABoD3i","provider":"onedrive","description":"","fileSizeOrPages":"OneDrive • Arquivo para Download"}],"materials":[{"id":"m0","title":"Resumo: leitura do paquímetro","content":"RESOLUÇÃO = menor divisão da escala fixa ÷ número de divisões do nônio\n• 1 mm ÷ 20 = 0,05 mm\n• 1 mm ÷ 50 = 0,02 mm\n\nCOMO LER\n1. Leia os milímetros inteiros na escala fixa, até o zero do nônio.\n2. Procure o traço do nônio que coincide com um traço da escala fixa.\n3. Multiplique esse número do traço pela resolução.\n4. Some os dois valores.\n\nEXEMPLO (resolução 0,05 mm)\nZero do nônio entre 23 e 24 mm; o 7º traço coincide.\nLeitura = 23 + 7 × 0,05 = 23,35 mm\n\nBOAS PRÁTICAS: limpe as faces, feche o paquímetro e confira o zero antes de medir, não force o encosto."},{"id":"m1","title":"Resumo: micrômetro externo (0,01 mm)","content":"PRINCÍPIO\nPasso do fuso de 0,5 mm e tambor com 50 divisões → 0,5 ÷ 50 = 0,01 mm de resolução.\n\nCOMO LER\n1. Leia na bainha os milímetros e os meios milímetros visíveis.\n2. Leia no tambor o traço alinhado com a linha de referência da bainha.\n3. Multiplique o valor do tambor por 0,01 e some.\n\nEXEMPLO\nBainha: 7,5 mm | Tambor: 28\nLeitura = 7,5 + 28 × 0,01 = 7,78 mm\n\nBOAS PRÁTICAS\n• Use sempre a catraca para aplicar o torque correto.\n• Limpe as faces de medição e confira o zero.\n• Segure o micrômetro pelo arco, para não aquecer a peça com a mão."},{"id":"m2","title":"Exercícios de fixação (com gabarito)","content":"1) Qual a resolução de um paquímetro com nônio de 20 divisões?\n2) Zero do nônio logo após 12 mm, o 9º traço coincide, resolução 0,02 mm. Qual a leitura?\n3) Micrômetro: bainha 5,0 mm e tambor 37. Qual a leitura?\n4) Peça especificada em 25 ± 0,05 mm medida em 25,08 mm. Aprovada ou reprovada?\n\nGABARITO\n1) 1 ÷ 20 = 0,05 mm.\n2) 12 + 9 × 0,02 = 12,18 mm.\n3) 5,0 + 37 × 0,01 = 5,37 mm.\n4) Reprovada: o limite máximo é 25,05 mm e a peça mediu 25,08 mm."}],"anims":["paq","mic","micm","comp","bore"]}]</script>
